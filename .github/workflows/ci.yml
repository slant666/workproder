name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, Build, Scan, and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      WORK_ORDER_DB_NAME: work_order_system
      WORK_ORDER_CONTAINER_DB_USERNAME: work_order_app
      WORK_ORDER_CONTAINER_DB_PASSWORD: ci-app-password
      WORK_ORDER_CONTAINER_DB_ROOT_PASSWORD: ci-root-password
      WORK_ORDER_BOOTSTRAP_ADMIN_TOKEN: ci-bootstrap-token
      WORK_ORDER_HTTP_PORT: 8088
      WORK_ORDER_MYSQL_HOST_PORT: 3307
      WORK_ORDER_REDIS_HOST_PORT: 6379
      WORK_ORDER_REDIS_TIMEOUT: 2s
      WORK_ORDER_RABBITMQ_ENABLED: "true"
      WORK_ORDER_RABBITMQ_HOST_PORT: 5672
      WORK_ORDER_RABBITMQ_MANAGEMENT_HOST_PORT: 15672
      WORK_ORDER_RABBITMQ_USERNAME: workorder
      WORK_ORDER_RABBITMQ_PASSWORD: workorder
      WORK_ORDER_ATTACHMENT_MAX_SIZE_BYTES: 10485760
      WORK_ORDER_ATTACHMENT_STORAGE_PROVIDER: minio
      WORK_ORDER_MINIO_HOST_PORT: 9000
      WORK_ORDER_MINIO_CONSOLE_HOST_PORT: 9001
      WORK_ORDER_MINIO_ACCESS_KEY: workorder
      WORK_ORDER_MINIO_SECRET_KEY: workorder-secret
      WORK_ORDER_MINIO_BUCKET: work-order-attachments
      WORK_ORDER_MINIO_REGION: us-east-1
      SPRING_MAIL_HOST: ""
      SPRING_MAIL_PORT: 465
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "true"
      WORK_ORDER_EMAIL_FROM: no-reply@work-order.local
      WORK_ORDER_EMAIL_DELIVERY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Frontend type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: mvn -B test

      - name: Frontend dependency security check
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Filesystem security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: work-order-system-backend:latest
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: work-order-system-frontend:latest
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Deploy test environment
        run: docker compose up -d

      - name: Wait for test environment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if docker compose ps --format json | jq -e 'select(.Health == "unhealthy")' >/dev/null; then
              docker compose ps
              docker compose logs --tail=200 backend frontend
              exit 1
            fi
            if docker compose ps --format json | jq -e 'select(.Service == "frontend" and .Health == "healthy")' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 backend frontend
          exit 1

      - name: Backend health check
        run: docker compose exec -T backend wget -qO- http://127.0.0.1:8080/api/system/status

      - name: Frontend health check
        run: curl --fail --show-error --silent http://127.0.0.1:8088/ >/dev/null

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Stop test environment
        if: always()
        run: docker compose down -v
