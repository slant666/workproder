spring:
  application:
    name: work-order-system
  servlet:
    multipart:
      max-file-size: ${WORK_ORDER_ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${WORK_ORDER_ATTACHMENT_MAX_REQUEST_SIZE:10MB}
  datasource:
    url: ${WORK_ORDER_DB_URL:jdbc:mysql://localhost:3306/work_order_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${WORK_ORDER_DB_USERNAME}
    password: ${WORK_ORDER_DB_PASSWORD}
  data:
    redis:
      host: ${WORK_ORDER_REDIS_HOST:localhost}
      port: ${WORK_ORDER_REDIS_PORT:6379}
      password: ${WORK_ORDER_REDIS_PASSWORD:}
      timeout: ${WORK_ORDER_REDIS_TIMEOUT:2s}
  rabbitmq:
    host: ${WORK_ORDER_RABBITMQ_HOST:localhost}
    port: ${WORK_ORDER_RABBITMQ_PORT:5672}
    username: ${WORK_ORDER_RABBITMQ_USERNAME:guest}
    password: ${WORK_ORDER_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

app:
  bootstrap:
    admin-token: ${WORK_ORDER_BOOTSTRAP_ADMIN_TOKEN:}
  attachments:
    upload-dir: ${WORK_ORDER_ATTACHMENT_DIR:uploads/work-order-attachments}
    max-size-bytes: ${WORK_ORDER_ATTACHMENT_MAX_SIZE_BYTES:10485760}
    storage-provider: ${WORK_ORDER_ATTACHMENT_STORAGE_PROVIDER:local}
    minio:
      endpoint: ${WORK_ORDER_MINIO_ENDPOINT:http://localhost:9000}
      external-endpoint: ${WORK_ORDER_MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
      access-key: ${WORK_ORDER_MINIO_ACCESS_KEY:workorder}
      secret-key: ${WORK_ORDER_MINIO_SECRET_KEY:workorder-secret}
      bucket: ${WORK_ORDER_MINIO_BUCKET:work-order-attachments}
      region: ${WORK_ORDER_MINIO_REGION:us-east-1}
  email:
    delivery-enabled: ${WORK_ORDER_EMAIL_DELIVERY_ENABLED:false}
    from: ${WORK_ORDER_EMAIL_FROM:no-reply@work-order.local}
    max-attempts: ${WORK_ORDER_EMAIL_MAX_ATTEMPTS:5}
    batch-size: ${WORK_ORDER_EMAIL_BATCH_SIZE:20}
    verification-code-ttl-minutes: ${WORK_ORDER_EMAIL_VERIFICATION_TTL_MINUTES:10}
    password-reset-ttl-minutes: ${WORK_ORDER_PASSWORD_RESET_TTL_MINUTES:30}
  async:
    rabbit-enabled: ${WORK_ORDER_RABBITMQ_ENABLED:true}

